server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    # 上传大附件时避免 Tomcat 在连接层面先掐断
    max-swallow-size: -1

spring:
  application:
    name: haixiajin-oa

  servlet:
    multipart:
      enabled: true
      # 单文件 20MB / 单次请求 60MB（一次提交可能带多个附件）
      # 与 oa.storage.max-file-size 必须对齐，否则会被 Tomcat 层先拒掉，报错还看不出是配置问题
      max-file-size: 20MB
      max-request-size: 60MB
      file-size-threshold: 1MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 【占位符命名契约，改前必读】
    #   · 基础/local 配置统一用 OA_DB_*（默认值=本机演示库，直连即可跑）；
    #   · test profile（application-test.yml）用 MYSQL_*——那是 docker-test/.env 的既有键名契约；
    #   · 历史教训：基础配置曾用 ${MYSQL_USER:root}，而 .env 恰好有同名键 → 本地启动
    #     吃进测试库凭据，报 Access denied（详见 application-local.yml 头注释与 2026-09-22 日志）。
    #     基础配置永远不要使用 .env 里出现过的键名。
    url: jdbc:mysql://${OA_DB_HOST:127.0.0.1}:${OA_DB_PORT:3306}/${OA_DB_NAME:haixiajin_oa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${OA_DB_USER:root}
    password: ${OA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OaHikariPool

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

# ---------------------------------------------------------------------------
# MyBatis-Plus
# ---------------------------------------------------------------------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 开发期想看 SQL 可改为 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------------------------------------------------------------------
# Flowable 流程引擎
#   database-schema-update=true 首次启动会自动创建 ACT_* 表（约 60 张）
#   生产环境建议改为 false，改用官方 SQL 脚本手工执行
# ---------------------------------------------------------------------------
flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: full
  check-process-definitions: false
  process:
    definition-cache-limit: 128

# ---------------------------------------------------------------------------
# 业务配置
# ---------------------------------------------------------------------------
oa:
  jwt:
    # 必须由环境变量 OA_JWT_SECRET 注入（>= 32 字节）。**留空即启动失败**（fail-fast）：
    # 原实现有内置默认值，会让"忘记配置"静默通过，而那串默认值已随公开仓库公开。
    # 本地联调：运行「启动联调版.command」，它会自动生成并复用 oa-backend/.jwt_secret。
    secret: ${OA_JWT_SECRET:}
    expire-minutes: 720

  # CORS 来源白名单。
  # 默认（false）只放行本机联调地址；用 file:// 打开页面联调时才需要 true（放行任意 origin）。
  # 部署到服务器且前端另起域名时，把域名写进 OA_CORS_ALLOWED_ORIGINS（逗号分隔），无需改代码。
  cors:
    permissive: ${OA_CORS_PERMISSIVE:false}

  # ---------------------------------------------------------------------------
  # 超时升级：节点超过处理时限后，把上级部门负责人「加签」进来一起推。
  #
  # ⚠ 需求尚未确认（用户："目前还不知道有无这个需求"）⇒ **默认关闭**：
  #    没这个需求时，它不会真的去打扰任何人（不会加签、不会发通知）。
  #    打开：OA_FLOW_ESCALATION_ENABLED=true（或改这里的默认值）。
  # 手动触发 POST /api/flows/escalation/run（需 system:flow）**不受此开关限制** ——
  #    它是运维的显式动作，也是验证用例做确定性检查的入口。
  # 生效方式是「加签」而不是「改派」：不改写节点 assignee，
  #    原承办人保留，流程历史里"谁该审"不会变味。
  # ---------------------------------------------------------------------------
  flow:
    escalation:
      enabled: ${OA_FLOW_ESCALATION_ENABLED:false}
      # 定时盘点间隔与首次延迟（毫秒）
      interval-ms: ${OA_FLOW_ESCALATION_INTERVAL_MS:600000}
      initial-delay-ms: ${OA_FLOW_ESCALATION_INITIAL_DELAY_MS:60000}
    allowed-origins: ${OA_CORS_ALLOWED_ORIGINS:}

  # ---------------------------------------------------------------------------
  # 附件存储
  #   type=local   → LocalStorageService（本机磁盘，零外部依赖）
  #   type=oss     → OssStorageService（阿里云 OSS，见下方 oa.oss 段）
  #   attachment.file_key 里存的是实现自定的键，切存储时旧数据需要做一次搬迁
  # ---------------------------------------------------------------------------
  storage:
    type: ${OA_STORAGE_TYPE:local}
    local:
      root: ${OA_STORAGE_ROOT:./data/attachments}
    # 单文件上限（字节），需与 spring.servlet.multipart.max-file-size 保持一致
    max-file-size: 20971520
    allowed-ext: jpg,jpeg,png,gif,bmp,webp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,zip,rar,7z

  # ---------------------------------------------------------------------------
  # 阿里云 OSS。仅当 oa.storage.type=oss 时被读取；本地联调留空即可。
  # 密钥无默认值，必须由环境变量注入（仓库是 public，任何默认值都等于公开泄露）。
  # ---------------------------------------------------------------------------
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    # 私有桶：业务附件（走 /api/attachments/** 鉴权代理下载，不直接对外暴露 URL）
    bucket: ${OSS_BUCKET:}
    # 公开桶：无需鉴权即可访问的资源（当前代码中没有这类资源，预留）
    public-bucket: ${OSS_PUBLIC_BUCKET:}
    # 上传时让 SDK 依扩展名推断 Content-Type，避免浏览器下载 zip 时一律弹"另存为"
    auto-content-type: true

  # ---------------------------------------------------------------------------
  # Redis：登录失败限速 + 权限快照缓存的跨实例共享层。
  #   enabled=false（默认）→ 走进程内实现，行为与改造前一致，本地零依赖跑通
  #   enabled=true         → 蓝绿双实例共享计数与缓存，见 RedisConfig
  # ---------------------------------------------------------------------------
  redis:
    enabled: ${OA_REDIS_ENABLED:false}
    key-prefix: "oa:"

  # ---------------------------------------------------------------------------
  # 日志：目录由 logback-spring.xml 读取（oa.log.dir）
  # ---------------------------------------------------------------------------
  log:
    dir: ${OA_LOG_DIR:./logs}

# OpenAPI 文档：**默认关闭**。
# 它会把全部接口路径、参数与 DTO 结构以 JSON 形式暴露给**未认证**访客（实测 70KB），
# 等于给攻击者一份完整攻击面地图。前端登录页的连通性探测已改用轻量的 /api/ping，
# 不再依赖此端点，因此可以安全关闭。需要查文档时用 OA_OPENAPI_ENABLED=true 临时打开。
springdoc:
  api-docs:
    enabled: ${OA_OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OA_OPENAPI_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.hxj.oa: DEBUG
    org.flowable: WARN
    org.springframework.jdbc: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
