# ===========================================================================
# 本地演示 profile（spring.profiles.active=local）
#
# 【职责】把「零外部依赖」钉死在本文件：本机 MySQL + 进程内限速/缓存 + 本地磁盘附件。
#   一切外部凭据（docker-test/.env）只属于 test profile——启动脚本对 local 不加载 .env。
#
# 【与基础 application.yml 的分工】
#   数据源的默认值已在基础文件里（OA_DB_* 占位符，默认=本机演示库），本文件**不再重复**
#   声明 datasource——两处各写一份必然漂移。隔离靠两条：
#   1. 启动脚本：local profile 不加载 .env（外部凭据进不来）；
#   2. 键名契约：基础配置只用 OA_DB_*，与 .env 的 MYSQL_* 物理不同名——即使有人手动
#      source 了 .env，环境变量也劫持不了本地数据源。
#   （历史教训：基础配置曾用 ${MYSQL_USER:root}，.env 建立后测试库凭据漏进本地启动，
#    报 Access denied for 'root'@'localhost'，TCP/端口看起来一切正常，极易误判。）
#
# 【需要换本机库时】不必改本文件，用环境变量覆盖：OA_DB_HOST / OA_DB_PORT /
#   OA_DB_NAME / OA_DB_USER / OA_DB_PASSWORD。
# ===========================================================================

# ---------------------------------------------------------------------------
# Flowable：与基础 yml 相同（显式写一遍，让本文件自洽可读，不必翻基础文件对账）
# ---------------------------------------------------------------------------
flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: full
  check-process-definitions: false

oa:
  jwt:
    # 与基础 yml 同名占位符（OA_JWT_SECRET），由启动脚本注入；此处不设默认值，保持 fail-fast
    secret: ${OA_JWT_SECRET:}
    expire-minutes: 720

  # 本地只放行本机联调地址（显式置空：防 OA_CORS_ALLOWED_ORIGINS 之类环境变量漏进来）
  cors:
    permissive: false
    allowed-origins: ""

  # 附件存本机磁盘（显式钉死 local，不读 OA_STORAGE_TYPE）
  storage:
    type: local
    local:
      root: ${OA_STORAGE_ROOT:./data/attachments}

  # Redis 关闭：登录限速与权限缓存走进程内实现
  redis:
    enabled: false
    key-prefix: "oa:"

  log:
    dir: ${OA_LOG_DIR:./logs}

# 接口文档默认关闭（不在 /api/** 前缀下，开了就是未认证可读，见基础 yml 的说明）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 本地开发：业务日志开 DEBUG 方便排查；Flowable 保持 WARN 压噪音
logging:
  level:
    root: INFO
    com.hxj.oa: DEBUG
    org.flowable: WARN
    org.springframework.jdbc: INFO
