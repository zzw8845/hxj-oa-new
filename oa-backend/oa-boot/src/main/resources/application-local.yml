# ===========================================================================
# 本地演示 profile（spring.profiles.active=local）
#
# 【职责】只做一件事：把「零外部依赖」钉死——本机 MySQL + 进程内限速/缓存 +
#   本地磁盘附件。其余配置全部继承基础 application.yml（2026-09-22 收敛：
#   flowable/jwt/springdoc/logging 曾在此重复声明，解析后与 base 完全等值，
#   属"同语义两份必然漂移"的隐患，已删——**这些配置的唯一出处是 base**）。
#
# 【为什么下面四枚钉子要显式写】它们的 base 键读了 .env 里也存在的环境变量
#   （OA_CORS_ALLOWED_ORIGINS / OA_STORAGE_TYPE / OA_LOG_DIR）。启动脚本对 local
#   不加载 .env，但万一有人手动 source 了 .env 再起服务，这四枚钉子保证：
#   附件仍写本地磁盘、不把 CORS 白名单带给本地、日志不写去服务器的 /logs、
#   Redis 仍走进程内实现。值与 base 默认一致，防的是"环境变量劫持"这一种风险。
#
# 【与 test 的关系】数据源/Redis/OSS 等外部凭据只属于 test profile（.env 契约）。
# ===========================================================================

oa:
  # 本地只放行本机联调地址（钉死，防 OA_CORS_ALLOWED_ORIGINS 漏进来）
  cors:
    permissive: false
    allowed-origins: ""

  # 附件存本机磁盘（钉死 local，不读 OA_STORAGE_TYPE）
  storage:
    type: local
    local:
      root: ${OA_STORAGE_ROOT:./data/attachments}

  # Redis 关闭：登录限速与权限缓存走进程内实现（钉死，防误开外网 Redis）
  redis:
    enabled: false
    key-prefix: "oa:"

  # 日志写本地 ./logs（钉死，防 OA_LOG_DIR=/logs 把本地日志写飞）
  log:
    dir: ${OA_LOG_DIR:./logs}
