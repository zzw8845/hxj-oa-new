# ===========================================================================
# 测试服务器 profile（spring.profiles.active=test）
#
# 【凭据策略】本仓库是 public，任何写进文件的密钥都等于公开泄露。
#   因此本文件里 **不出现** 任何密码/密钥字面量，全部走环境变量，
#   由 docker-compose 的 env_file: .env 注入（.env 已被 .gitignore 排除）。
#   非敏感项（主机/端口/库名）保留已知测试值作为默认值，便于自查配置是否生效。
#
# 资产清单见 docker-test/.env.example。
# ===========================================================================

server:
  port: 8080
  tomcat:
    # 【为什么从 400 压到 100】
    # 先纠正一个容易想当然的判断：Linux 的线程栈是**惰性提交**的，400 个线程并不会真的
    # 吃掉 400MB 常驻内存（cgroup 只统计真正被触碰过的页，每线程通常只有几十 KB）。
    # 所以线程数不是这个容器的内存瓶颈 —— 真正的大头是堆、元空间与直接缓冲区。
    #
    # 压到 100 是把它当成**并发上限**来用：测试服务器内存只有 3.48GB，
    # 且蓝绿发布期间两个 OA 实例并存、每个实例容器上限 700MB。
    # 100 个并发请求所带动的 Flowable 引擎对象图、MyBatis 结果集与流式缓冲区，
    # 是启动后内存曲线里最容易冲顶的那一段；把入口卡住，等于给 700MB 上限上了保险。
    # 测试环境并发用户就那么几个，100 线程完全够用，压低了只有好处。
    threads:
      max: 100
      min-spare: 10
    # 反向代理（nginx）在前，让 request.getRemoteAddr() / 日志拿到真实客户端 IP
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 库名 hxj-oa 含连字符；serverTimezone 必须显式指定，否则 JDBC 驱动按 JVM 默认时区解释
    url: jdbc:mysql://${MYSQL_HOST:47.115.133.58}:${MYSQL_PORT:3305}/${MYSQL_DATABASE:hxj-oa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&zeroDateTimeBehavior=convertToNull
    username: ${MYSQL_USER:root}
    # 无默认值：未注入即连接失败并明确报错，好过静默连上一个错库
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OaHikariPool
      # 数据库在另一台机器上，探测一次，别让坏连接拖到业务线程
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:47.107.79.42}
      port: ${REDIS_PORT:6378}
      password: ${REDIS_PASSWORD}
      # 【必须用独立 db 索引，不要用 0】
      # 这台 Redis 是**多项目共用**的：db0 已被 WMS/物流项目占用
      # （实测 25 个 key：KuaiDi100:*、JST_ACCESS_TOKEN、PACKING_LOCK:*、DISTRIBUTION_LOCK:* …），
      # db1/db2 也是它的。混在 db0 里一旦有人手滑 FLUSHDB，会连带清掉别人的数据。
      # db3 实测为空，OA 独占。（db4+ 空闲，将来要再隔离也有余地）
      database: ${REDIS_DATABASE:3}
      # 连接超时必须短：Redis 挂了要立刻降级到本地实现，不能把登录接口一起拖死
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s
        shutdown-timeout: 200ms

# Flowable 段已收敛到基础 application.yml（2026-09-22）：数值完全一致，唯一定义处=base。
# 部署稳定后想把 schema-update 改 false 换干净启动日志，去 base 改。

oa:
  # 测试服务器必须显式注入；docker-compose 从 .env 读取，绝不使用内置默认值
  # （注意与 base 的 ${OA_JWT_SECRET:} 语义不同：这里**无默认值**，不注入即启动失败）
  jwt:
    secret: ${OA_JWT_SECRET}
    expire-minutes: 720

  # 附件走 OSS；本地磁盘路径在容器里是易失的，蓝绿切换还会分成两份
  storage:
    type: ${OA_STORAGE_TYPE:oss}
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-shenzhen.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket: ${OSS_BUCKET:shenzhen-rlzx}
    public-bucket: ${OSS_PUBLIC_BUCKET:can-open-resource-shenzhen-rlzx}

  redis:
    enabled: true

  log:
    dir: ${OA_LOG_DIR:/logs}

# springdoc 段已收敛到基础 application.yml（2026-09-22）：表达式与默认值逐字相同
# （${OA_OPENAPI_ENABLED:false}），.env 里的开关对 test profile 依然生效——经 base 读取。
# 安全背景（77KB 完整接口契约未认证可读的教训）见 base 的 springdoc 注释。

logging:
  level:
    root: INFO
    # 测试环境不开 DEBUG：蓝绿两实例同时写日志，DEBUG 会让 IO 成为瓶颈
    com.hxj.oa: INFO
    org.flowable: WARN
    # MyBatis-Plus 的 SQL 明细走 DEBUG；需要排查慢 SQL 时单独调这个（见 logback 的 SQL 段）
    com.hxj.oa.system.mapper: INFO
    com.hxj.oa.document.mapper: INFO
    com.hxj.oa.flow.mapper: INFO
    org.springframework.jdbc: INFO
