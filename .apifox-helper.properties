# ============================================================================
# Apifox Helper（IDEA 插件）项目内配置
#
# 位置：工程根目录 => 对本工程全部模块生效。
# 目的：让「代码注释同步到 Apifox」的结果与**接口真实响应**保持一致。
#
# ⚠ 本文件是给公司前端用的约定：改接口 = 改注释；改完注释重新 Sync 即可，
#    不要再去 Apifox 网页端手工改字段（当前同步模式是「覆盖所有字段」）。
# ============================================================================

# ── 1. 时间字段（必配，有实测依据）───────────────────────────────────────────
# 实测：GET /api/documents 返回 "createdAt": "2026-09-20T10:16:34"
# 即 ISO-8601 字符串（秒精度、不带时区）。
# 不配这两条，Apifox 会把 LocalDateTime 渲染成 {year,month,day,...} 对象结构，
# 与真实响应不符 —— 前端会照着错的结构去写解析，而且当场看不出来。
json.rule.convert[java.time.LocalDateTime]=java.lang.String
json.rule.convert[java.time.LocalDate]=java.lang.String

# ── 2. 解析深度（默认够用，报错再放开）───────────────────────────────────────
# 本项目的响应形状最深约四层（R<PageResult<实体>>，详情 VO 里再嵌一层）。
# 若同步时报 "is to complex. Blocked cause by ... reached ..."，把下面两行取消注释：
# max.deep=8
# max.elements=512

# ── 3. ⚠ 刻意【不】配置 / 不写的东西（配了反而错）─────────────────────────────
#
# ✗ 不要加 method.return
#     那是给「控制器没有声明公共返回包装类型」的项目补包装用的。
#     本项目每个方法都显式声明了 R<T>；再加会让响应变成 R<R<T>>（双层包装）。
#
# ✗ 不要给查询对象参数加 @ModelAttribute
#     插件的内置规则是：参数默认按 query 识别；带 @RequestBody 才是 JSON；
#     带 @ModelAttribute 会被当成 **form-data**。
#     本项目的 DocumentQuery / SealQuery / LedgerExportQuery 都是 GET 的查询对象，
#     现在（无注解）恰好被正确识别为 query。加上 @ModelAttribute 会变成 form-data，
#     与实际情况不符 —— 这是个「加了反而坏」的坑，改之前先读这段。
#
# ✗ 不要 ignore 任何字段
#     deleted、timestamp 这类字段确实会出现在真实响应里，藏起来只会让文档与事实不符。
#     每个字段的含义都写在实体类 / DTO 的字段注释里。
#
# ── 4. 同步后请逐项自查（这几条只有真跑一遍插件才能确认）─────────────────────
# ① 任意 R<PageResult<X>> 接口（如 GET /api/documents）：
#    响应里应能看到 R 的 4 个字段，且 data 里能看到 PageResult 的 5 个字段
#    （total / pageNum / pageSize / pages / records）。
#    若 data 只显示成空对象 {}，说明泛型没被展开，把下面两行取消注释后重新 Sync：
# json.rule.convert[com.hxj.oa.common.api.R]=java.lang.Object
# json.rule.convert[#regex:com.hxj.oa.common.api.R]=${1}
#
# ② GET /api/documents：应展开出 DocumentQuery 的字段名作为 query 参数，
#    而不是一个名字叫 query 的单个参数。
# ③ 任意时间字段：应是字符串示例，不是 {year, month, ...}。
# ④ 目录名：应与各控制器类注释的首行一致（如「部门管理」「待办与审批动作」）。
